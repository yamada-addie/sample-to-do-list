<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>home</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
            <div class="container">
                <h1>Simple Kanban Board</h1>
                <div class="board">
                    <div class="list" id="list1">
                    <h2>To Do</h2>
                    </div>
                    <div class="list" id="list2">
                        <h2>In Progress</h2>
                    </div>

                    <div class="list" id="list3">
                        <h2>Done</h2>
                    </div>
                </div>
                <input type="text" id="userInput" placeholder="Enter task name here">
                <button id="submitBtn">Add</button>
            </div>
        <script src="scripts.js"></script>
    </body>
</html>
